<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmotionScope | Change Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <nav class="topbar">
        <div class="brand">EmotionScope</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/change_password" class="active">Change Password</a>
            <form action="/logout" method="post" class="logout-form">
                <button type="submit" class="nav-link-button">Logout</button>
            </form>
        </div>
    </nav>

    <header class="hero">
        <h1>Change Password</h1>
        <p>
            Update your account credentials to keep your access secure and protected.
        </p>
    </header>

    <main class="auth-wrapper">
        <section class="auth-card">

            <h2>Update your password</h2>
            <p class="auth-subtext">
                Enter your current password and choose a new one.
            </p>

            {% if error %}
                <div class="error-box">{{ error }}</div>
            {% endif %}

            <form method="post" action="/change_password" class="auth-form">

                <input
                    name="current_password"
                    type="password"
                    placeholder="Current Password"
                    required>

                <input
                    name="new_password"
                    type="password"
                    placeholder="New Password"
                    required>

                <input
                    name="confirmation"
                    type="password"
                    placeholder="Confirm New Password"
                    required>

                <button type="submit">Update Password</button>

            </form>

            <p class="switch-text">
                Changed your mind?
                <a href="/">Go back home</a>
            </p>

        </section>
    </main>

</body>
</html>
