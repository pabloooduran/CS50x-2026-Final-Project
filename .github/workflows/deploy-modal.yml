name: Deploy live demo to Modal

on:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "analyzer.py"
      - "modal_app.py"
      - "templates/**"
      - "static/**"
      - "emotion_app.db"
      - ".github/workflows/deploy-modal.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Check Modal credentials
        run: |
          fail=0
          check() {  # name, value, expected prefix
            if [ -z "$2" ]; then echo "::error title=$1::Secret $1 is empty or missing"; fail=1; return; fi
            case "$2" in "$3"*) ;; *) echo "::error title=$1::$1 should start with $3"; fail=1;; esac
            case "$2" in *[[:space:]]*) echo "::error title=$1::$1 contains spaces or line breaks"; fail=1;; esac
            echo "::notice title=$1::format OK (length ${#2})"
          }
          check MODAL_TOKEN_ID "$MODAL_TOKEN_ID" "ak-"
          check MODAL_TOKEN_SECRET "$MODAL_TOKEN_SECRET" "as-"
          exit $fail

      - name: Deploy
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/deploy.log"  # outside the repo, which is uploaded to Modal
          if ! modal deploy modal_app.py 2>&1 | tee "$log"; then
            msg=$(tail -n 20 "$log" | tr -d '\r' | sed 's/%/%25/g' | tr '\n' ' ')
            echo "::error title=modal deploy failed::${msg}"
            exit 1
          fi
